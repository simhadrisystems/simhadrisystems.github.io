<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">

  <!-- Transparent background -->
  <rect width="512" height="512" fill="none"/>

  <!-- Scaled and centered W -->
  <g transform="translate(-20,-10) scale(0.92)">

    <path d="
      M100 100
      C160 520, 240 520, 260 260
      S300 160, 320 260
      S400 520, 500 100"
      fill="none"
      stroke="url(#ribbonGrad)"
      stroke-width="80"
      stroke-linecap="round"
      stroke-linejoin="round"/>

  </g>

  <!-- Gradient -->
  <defs>
    <linearGradient id="ribbonGrad" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E88E5"/>
      <stop offset="35%" stop-color="#FF4081"/>
      <stop offset="65%" stop-color="#F4511E"/>
      <stop offset="100%" stop-color="#FFD54F"/>
    </linearGradient>
  </defs>

</svg>